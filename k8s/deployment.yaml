## ─────────────────────────────────────────────────────────────────────────────
## deployment.yaml — Next.js App + Istio Service Mesh
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viaja-con-moni-app
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viaja-con-moni-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      ## maxSurge: 0 + maxUnavailable: 1 → mata un pod viejo ANTES de crear
      ## el nuevo. Necesario en clusters de un solo nodo con CPU limitada.
      ## maxSurge: 1 requeriría tener 3 pods simultáneos durante el deploy.
      maxSurge:       0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: viaja-con-moni-app
        app.kubernetes.io/name:    viaja-con-moni-app
        app.kubernetes.io/part-of: viaja-con-moni
        version: "v1"
      annotations:
        secret.reloader.stakater.com/reload: "app-secret"
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["viaja-con-moni-app"]
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Esperando a PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL disponible ✅"

        - name: migrate
          ## :migrate = stage "migrator" del Dockerfile — tiene node_modules
          ## completo con el CLI de prisma. El stage "runner" (usado por el
          ## container principal) NO incluye el CLI por optimización de tamaño.
          image: ghcr.io/matucr/web-viajes:migrate
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "▶ Corriendo migraciones..."
              node_modules/.bin/prisma migrate deploy
              echo "✅ Migraciones completadas"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL

      containers:
        - name: app
          image: ghcr.io/matucr/web-viajes:sha-bcb6d5c
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              value: "http://181.209.94.221"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          resources:
            requests:
              ## 100m por pod × 2 pods = 200m total para la app
              ## Suficiente para Next.js en producción liviana
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3000
            initialDelaySeconds: 20
            periodSeconds:       15
            timeoutSeconds:      3
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            runAsNonRoot:             true
            runAsUser:                1001
            capabilities:
              drop: ["ALL"]

---

apiVersion: v1
kind: Service
metadata:
  name: viaja-con-moni-service
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  type: ClusterIP
  selector:
    app: viaja-con-moni-app
  ports:
    - name:       http
      port:       80
      targetPort: 3000
      protocol:   TCP
