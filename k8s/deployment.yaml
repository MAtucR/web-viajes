## ─────────────────────────────────────────────────────────────────────────────
## deployment.yaml — Next.js App + Istio Service Mesh
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viaja-con-moni-app
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viaja-con-moni-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: viaja-con-moni-app
        app.kubernetes.io/name:    viaja-con-moni-app
        app.kubernetes.io/part-of: viaja-con-moni
        ## ── Istio: requerido para DestinationRule subsets ────────────────────
        ## Permite enrutar tráfico a subsets específicos (canary, blue-green).
        ## Cambiar a "v2" al desplegar una nueva versión en paralelo.
        version: "v1"
      annotations:
        secret.reloader.stakater.com/reload: "app-secret"
        ## ── Istio: garantiza que el proxy Envoy esté listo ANTES de que
        ## arranque el contenedor principal. Evita race conditions donde la app
        ## intenta conectarse al mesh antes de que el sidecar esté activo.
        proxy.istio.io/config: |
          holdApplicationUntilProxyStarts: true
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["viaja-con-moni-app"]
                topologyKey: kubernetes.io/hostname

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Esperando a PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL disponible ✅"
          ## ── NOTA ISTIO ───────────────────────────────────────────────────────
          ## Los initContainers se ejecutan SIN el sidecar Envoy activo en este
          ## pod. El tráfico va directo a postgres-service.
          ## Por eso postgres usa PeerAuthentication PERMISSIVE (ver peer-auth).

        - name: migrate
          ## :migrate = stage "migrator" del Dockerfile — tiene node_modules
          ## completo con el CLI de prisma. El stage "runner" (usado por el
          ## container principal) NO incluye el CLI por optimización de tamaño.
          ## El CI buildea y pushea :migrate en cada push a main.
          image: ghcr.io/matucr/web-viajes:migrate
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "▶ Corriendo migraciones..."
              node_modules/.bin/prisma migrate deploy
              echo "✅ Migraciones completadas"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL

      containers:
        - name: app
          image: ghcr.io/matucr/web-viajes:sha-8dedd7c
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: NEXTAUTH_SECRET
            ## NEXTAUTH_URL: actualizar al dominio real con HTTPS una vez que
            ## el Gateway de Istio esté configurado con TLS.
            - name: NEXTAUTH_URL
              value: "http://181.209.94.221"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /api/ping
              port: 3000
            initialDelaySeconds: 20
            periodSeconds:       15
            timeoutSeconds:      3
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   false
            runAsNonRoot:             true
            runAsUser:                1001
            capabilities:
              drop: ["ALL"]

---

apiVersion: v1
kind: Service
metadata:
  name: viaja-con-moni-service
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  type: ClusterIP
  selector:
    app: viaja-con-moni-app
  ports:
    - name:       http
      port:       80
      targetPort: 3000
      protocol:   TCP
