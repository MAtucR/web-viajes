## ─────────────────────────────────────────────────────────────────────────────
## k8s/istio/gateway.yaml
## Gateway + VirtualService de Istio
##
## REEMPLAZA: k8s/ingress.yaml (Traefik Ingress)
## Una vez validado este Gateway, eliminar ingress.yaml del repo.
## ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: viaja-con-moni-gateway
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  selector:
    istio: ingressgateway
  servers:
    ## ── HTTP ─────────────────────────────────────────────────────────────────
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        ## "*" acepta cualquier Host header → funciona con IP directa y con
        ## cualquier hostname mientras no haya DNS configurado.
        ## PRODUCCIÓN: reemplazar "*" por los dominios reales una vez que
        ## el DNS apunte al IngressGateway y se active TLS.
        - "*"
        ## Descomentar cuando el DNS esté listo y borrar el "*":
        ## - "viajaconmoni.com"
        ## - "www.viajaconmoni.com"

    ## ── HTTPS — descomentar cuando DNS + certificado TLS estén listos ────────
    ## Paso 1: crear Secret TLS en istio-system:
    ##   kubectl create secret tls viajaconmoni-tls \
    ##     --cert=tls.crt --key=tls.key -n istio-system
    ## Paso 2: descomentar y hacer commit. Cambiar "*" por los dominios reales.
    # - port:
    #     number: 443
    #     name: https
    #     protocol: HTTPS
    #   tls:
    #     mode: SIMPLE
    #     credentialName: viajaconmoni-tls
    #   hosts:
    #     - "viajaconmoni.com"
    #     - "www.viajaconmoni.com"

---

apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: viaja-con-moni-vs
  namespace: viaja-con-moni
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/name:    viaja-con-moni-app
    app.kubernetes.io/part-of: viaja-con-moni
spec:
  hosts:
    ## Debe coincidir con los hosts del Gateway.
    ## "*" = acepta cualquier Host header (IP directa o cualquier hostname).
    - "*"
  gateways:
    - viaja-con-moni-gateway
  http:
    - name: viaja-con-moni-route
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: viaja-con-moni-service
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "gateway-error,connect-failure,retriable-4xx"
      headers:
        response:
          add:
            X-Frame-Options: "SAMEORIGIN"
            X-Content-Type-Options: "nosniff"
            Referrer-Policy: "strict-origin-when-cross-origin"
          remove:
            - "x-powered-by"
            - "server"
