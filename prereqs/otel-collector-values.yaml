## ─────────────────────────────────────────────────────────────────────────────
## prereqs/otel-collector-values.yaml
## OpenTelemetry Collector — valores para Helm, exporta trazas a Dynatrace
##
## SETUP (una sola vez):
##   1. Crear el secret con el token de Dynatrace:
##        kubectl create namespace observability --dry-run=client -o yaml | kubectl apply -f -
##        kubectl create secret generic dt-otel-secret \
##          --from-literal=DT_API_TOKEN="<TU_TOKEN>" \
##          -n observability
##
##   2. Instalar con Helm:
##        helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
##        helm repo update
##        curl -o /tmp/otel-values.yaml \
##          https://raw.githubusercontent.com/MAtucR/web-viajes/main/prereqs/otel-collector-values.yaml
##        helm install otel-collector open-telemetry/opentelemetry-collector \
##          --namespace observability \
##          --values /tmp/otel-values.yaml
##
##   3. Verificar que levantó:
##        kubectl get pods -n observability
##
## ACTUALIZAR si cambia el token:
##   kubectl create secret generic dt-otel-secret \
##     --from-literal=DT_API_TOKEN="<NUEVO_TOKEN>" \
##     -n observability --dry-run=client -o yaml | kubectl apply -f -
##   kubectl rollout restart deployment/otel-collector-opentelemetry-collector -n observability
## ─────────────────────────────────────────────────────────────────────────────

mode: deployment
replicaCount: 1

## Requerido por versiones recientes del chart
image:
  repository: otel/opentelemetry-collector-contrib

## Inyectar el token desde el Secret — nunca hardcodeado
extraEnvsFrom:
  - secretRef:
      name: dt-otel-secret

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 5s
      send_batch_size: 512
    memory_limiter:
      check_interval: 1s
      limit_mib: 200
    resource:
      attributes:
        - key: deployment.environment
          value: production
          action: upsert
        - key: k8s.cluster.name
          value: tucucluster
          action: upsert

  exporters:
    ## otlp_http reemplaza al alias deprecado otlphttp
    otlp_http/dynatrace:
      endpoint: "https://dqk02008.live.dynatrace.com/api/v2/otlp"
      headers:
        Authorization: "Api-Token ${env:DT_API_TOKEN}"

  service:
    pipelines:
      traces:
        receivers:  [otlp]
        processors: [memory_limiter, batch, resource]
        exporters:  [otlp_http/dynatrace]

resources:
  requests:
    cpu:    "50m"
    memory: "128Mi"
  limits:
    cpu:    "200m"
    memory: "256Mi"
